# Halium A50: Samsung IDs (04e8:6860). The kernel configfs parses idVendor with base 0, so give DECIMAL values
# (a leading-zero "04e8" is read as octal -> EINVAL -> gadget never starts). 1256=0x04e8, 26720=0x6860
IDVENDOR=1256
IDPRODUCT_MTP=26720
IDPRODUCT_MTP_ADB=26720
# Samsung reports a PC port as a "Mains" charger (power_supply/usb online=0), so usb-moded never sees a cable:
# assume it is always connected (also drops the default rescue mode)
USB_MODED_ARGS="-f"
